<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sherri AR</title>

  <script src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.1.4/dist/mindar-image.prod.js"></script>
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.1.4/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body { margin: 0; overflow: hidden; font-family: sans-serif; }

    #ui {
      position: fixed; left: 0; right: 0; bottom: 0;
      z-index: 9999;
      background: rgba(0, 0, 0, 0.6);
      padding: 10px 12px 20px;
      color: white;
    }
    #message { text-align: center; font-size: 16px; margin-bottom: 8px; }

    #map {
      position: relative;
      max-height: 35vh;
      margin: 0 auto;
      width: fit-content;
    }
    #map img { display: block; max-height: 35vh; max-width: 100%; border-radius: 8px; }

    .spot {
      position: absolute;
      width: 44px; height: 44px;
      margin: -22px 0 0 -22px;
      border-radius: 50%;
      background: transparent;
      cursor: pointer;
    }
    .spot.active { box-shadow: 0 0 0 3px #00C853; }
  </style>
</head>
<body>
  <a-scene
    mindar-image="imageTargetSrc: https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.1.4/examples/image-tracking/assets/card-example/card.mind;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <a-asset-item id="sherriModel" src="./Sherri.glb"></a-asset-item>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity light="type: ambient; intensity: 1"></a-entity>
    <a-entity light="type: directional; intensity: 0.8" position="0 1 1"></a-entity>

    <a-entity mindar-image-target="targetIndex: 0">
      <a-gltf-model id="sherri" src="#sherriModel"
              position="0 0 0.1" rotation="0 0 0" scale="0.05 0.05 0.05"
              animation-mixer></a-gltf-model>

      <a-text value="Hi, I'm Sherri!" position="0 1.6 0.3" align="center" color="#FFFFFF" width="3"></a-text>

      <!-- Arrow: points RIGHT (+X) at rotation 0 -->
      <a-entity id="arrow" position="0 0.3 0.6" visible="false">
        <a-cylinder radius="0.04" height="0.6" position="-0.1 0 0" rotation="0 0 90" color="#FFD100"></a-cylinder>
        <a-cone radius-bottom="0.12" radius-top="0" height="0.25" position="0.32 0 0" rotation="0 0 -90" color="#FFD100"></a-cone>
      </a-entity>
    </a-entity>
  </a-scene>

  <!-- Map overlay -->
  <div id="ui">
    <div id="message">Tap the pin on the map and I'll point the way!</div>
    <div id="map">
      <img src="./campus-map.png" alt="Campus map">
    </div>
  </div>

  <script>
    // x and y = where the tap area sits on the map image, in % (0 = left/top, 100 = right/bottom)
    // angle = arrow direction for someone FACING the poster:
    //   0 = right, 180 = left, -90 = behind you, 90 = straight ahead
    const destinations = [
      { name: "A Wing", x: 21, y: 49, angle: 180 }
    ];

    const map = document.getElementById("map");
    const arrow = document.getElementById("arrow");
    const message = document.getElementById("message");

    destinations.forEach(function (dest) {
      const spot = document.createElement("div");
      spot.className = "spot";
      spot.style.left = dest.x + "%";
      spot.style.top = dest.y + "%";
      spot.title = dest.name;

      spot.addEventListener("click", function () {
        document.querySelectorAll(".spot").forEach(function (s) { s.classList.remove("active"); });
        spot.classList.add("active");

        arrow.setAttribute("rotation", "0 " + dest.angle + " 0");
        arrow.setAttribute("visible", true);
        message.textContent = "Follow the arrow to " + dest.name + "!";
      });

      map.appendChild(spot);
    });
  </script>
</body>
</html>
